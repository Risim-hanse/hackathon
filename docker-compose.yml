services:
  api:
    build:
      context: ./backend
    environment:
      CORS_ORIGINS: '*'
      DATABASE_PATH: /data/meditrack.db
    ports:
      - '8000:8000'
    volumes:
      - meditrack-data:/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - '8080:80'
    depends_on:
      - api

volumes:
  meditrack-data:
