# Render blueprint.
#
# Frontend is a STATIC site on purpose: it never cold-starts, so the demo URL
# is instant for judges. The API is a separate Docker web service and is
# optional — the app must work with it asleep.
#
# If Render rejects `runtime: static` in this plan, create the static site
# manually in the dashboard with:
#   build: cd frontend && npm install && npm run build
#   publish: frontend/dist
#   rewrite: /* -> /index.html

services:
  - type: web
    name: meditrack-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: meditrack-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_PATH
        value: /tmp/meditrack.db
