# Render blueprint.
#
# Frontend is a STATIC site on purpose: it never cold-starts, so the demo URL
# is instant for judges. The API is a separate Docker web service and is
# optional — the app must work with it asleep.
#
# If Render rejects `runtime: static` in this plan, create the static site
# manually in the dashboard with:
#   build: cd frontend && npm install && npm run build
#   publish: frontend/dist
#   rewrite: /* -> /index.html

services:
  - type: web
    name: meditrack-web
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Must be the API's onrender.com URL, set AFTER the API service exists.
      # Leave blank if you don't need scanning on the deployed site.
      - key: VITE_API_BASE_URL
        sync: false

  - type: web
    name: meditrack-api
    runtime: docker
    # Build context is the repo root; the Dockerfile COPYs from backend/.
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: CORS_ORIGINS
        value: '*'
      - key: DATABASE_PATH
        value: /tmp/meditrack.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
